<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Periksa sebelum digunakan</title><metadata>{&quot;authoring&quot;:&quot;native-vector&quot;,&quot;brief&quot;:&quot;Original editorial doodle for Bantuin, a service turning website briefs into planning documents. Controlled hand-drawn rounded ink lines, slight irregularity, simple shapes, generous negative space. Sea &amp; Sun palette: ocean blue #167DAD, ink #173444, pale sky #DFF2FA, sunshine yellow #FFD35A, blue-white paper #F0FBFF. Transparent background. No written words, gradients, 3D, heavy shadows, watermarks, stock characters, or certification badges. Match this asset family's geometry. A planning document inspected through a small magnifying glass with a pencil annotation in the margin. Communicate reviewing assumptions before use.&quot;}</metadata><g transform="translate(211 119) scale(1.12) rotate(-6)"><path d="M5 8Q4 2 12 3L113 1L143 30L145 180Q145 186 138 186L7 184Q0 184 1 177Z" fill="#f0fbff" stroke="#173444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M113 2L113 24Q113 31 121 30L142 30" fill="none" stroke="#167dad" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 44Q48 42 81 44" fill="none" stroke="#167dad" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 70Q62 68 119 71" fill="none" stroke="#173444" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 97Q62 95 119 98" fill="none" stroke="#173444" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 124Q62 122 88 125" fill="none" stroke="#173444" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M46 123Q75 111 111 120Q125 130 108 141Q72 148 40 138Q30 130 46 123Z" fill="none" stroke="#167dad" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><path d="M118 130Q143 133 15