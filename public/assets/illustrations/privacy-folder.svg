<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Penanganan data pribadi</title><metadata>{&quot;authoring&quot;:&quot;native-vector&quot;,&quot;brief&quot;:&quot;Original editorial doodle for Buatin, a service turning website briefs into planning documents. Controlled hand-drawn rounded ink lines, slight irregularity, simple shapes, generous negative space. Forest green #235C46, ink #202B27, sage #E4EEE7, restrained yellow #F3D37A. Transparent background. No written words, gradients, 3D, heavy shadows, watermarks, stock characters, or certification badges. Match this asset family's geometry. A closed document folder with a simple fastening tab and a small information sheet beside it. Communicate careful everyday handling of personal documents.&quot;}</metadata><g transform="translate(172 174) scale(1.15) rotate(-4)"><path d="M0 40L0 15Q0 7 9 8L77 8L96 26L204 25Q213 25 213 35L211 165Q211 173 202 173L10 174Q1 174 0 165Z" fill="#e4eee7" stroke="#235c46" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 72Q-4 64 5 64L211 61Q221 61 219 72L207 169Q207 176 199 176L10 176Q3 176 2 169Z" fill="#faf7ef" stroke="#202b27" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 94Q63 91 89 93" fill="none" stroke="#235c46" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(290 245) scale(1) rotate(-4)"><path d="M0 0L25 0L25 67Q12 78 0 67Z" fill="#e4eee7" stroke="#235c46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="12" cy="56" r="3" fill="#235c46" stroke="#235c46" stroke-width="1"/></g><g transform="translate(401 251) scale(0.43) rotate(12)"><path d="M5 8Q4 2 12 3L113 1L143 30L145 180Q145 186 138 186L7 184Q0 184 1 177Z" fill="#faf7ef" stroke="#202b27" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M113 2L113 24Q113 31 121 30L14