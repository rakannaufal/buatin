<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Hubungi pengelola</title><metadata>{&quot;authoring&quot;:&quot;native-vector&quot;,&quot;brief&quot;:&quot;Original editorial doodle for Bantuin, a service turning website briefs into planning documents. Controlled hand-drawn rounded ink lines, slight irregularity, simple shapes, generous negative space. Sea &amp; Sun palette: ocean blue #167DAD, ink #173444, pale sky #DFF2FA, sunshine yellow #FFD35A, blue-white paper #F0FBFF. Transparent background. No written words, gradients, 3D, heavy shadows, watermarks, stock characters, or certification badges. Match this asset family's geometry. An open envelope holding one message sheet, with a small conversation bubble beside it. Welcoming and practical with generous empty space.&quot;}</metadata><g transform="translate(162 195) scale(1.25) rotate(-6)"><path d="M0 48L105 -19L211 48L207 180L5 181Z" fill="#dff2fa" stroke="#167dad" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(49 -45) scale(0.77) rotate(0)"><path d="M5 8Q4 2 12 3L113 1L143 30L145 180Q145 186 138 186L7 184Q0 184 1 177Z" fill="#f0fbff" stroke="#173444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M113 2L113 24Q113 31 121 30L142 30" fill="none" stroke="#167dad" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 44Q48 42 81 44" fill="none" stroke="#167dad" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 70Q62 68 119 71" fill="none" stroke="#173444" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 97Q62 95 119 98" fill="none" stroke="#173444" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 124Q62 122 88 125" fill="none" stroke="#173444" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 48L1