<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Periksa email Anda</title><metadata>{&quot;authoring&quot;:&quot;native-vector&quot;,&quot;brief&quot;:&quot;Original editorial doodle for Buatin, a service turning website briefs into planning documents. Controlled hand-drawn rounded ink lines, slight irregularity, simple shapes, generous negative space. Forest green #235C46, ink #202B27, sage #E4EEE7, restrained yellow #F3D37A. Transparent background. No written words, gradients, 3D, heavy shadows, watermarks, stock characters, or certification badges. Match this asset family's geometry. A message sheet emerging from an open envelope, with a small directional line suggesting delivery. Neutral illustration suitable while verification is pending.&quot;}</metadata><g transform="translate(199 206) scale(1.1) rotate(-4)"><path d="M0 48L105 -19L211 48L207 180L5 181Z" fill="#e4eee7" stroke="#235c46" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(49 -45) scale(0.77) rotate(0)"><path d="M5 8Q4 2 12 3L113 1L143 30L145 180Q145 186 138 186L7 184Q0 184 1 177Z" fill="#faf7ef" stroke="#202b27" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M113 2L113 24Q113 31 121 30L142 30" fill="none" stroke="#235c46" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 44Q48 42 81 44" fill="none" stroke="#235c46" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 70Q62 68 119 71" fill="none" stroke="#202b27" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 97Q62 95 119 98" fill="none" stroke="#202b27" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 124Q62 122 88 125" fill="none" stroke="#202b27" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 48L104 115L211 48L207 180L5 181Z"