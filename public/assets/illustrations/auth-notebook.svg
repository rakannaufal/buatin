<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Mulai merencanakan</title><metadata>{&quot;authoring&quot;:&quot;native-vector&quot;,&quot;brief&quot;:&quot;Original editorial doodle for Buatin, a service turning website briefs into planning documents. Controlled hand-drawn rounded ink lines, slight irregularity, simple shapes, generous negative space. Forest green #235C46, ink #202B27, sage #E4EEE7, restrained yellow #F3D37A. Transparent background. No written words, gradients, 3D, heavy shadows, watermarks, stock characters, or certification badges. Match this asset family's geometry. An open project notebook with a pencil along its edge and a folded planning sheet tucked inside. A welcoming starting point for organizing a website idea.&quot;}</metadata><g transform="translate(344 90) scale(0.72) rotate(9)"><path d="M5 8Q4 2 12 3L113 1L143 30L145 180Q145 186 138 186L7 184Q0 184 1 177Z" fill="#e4eee7" stroke="#202b27" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M113 2L113 24Q113 31 121 30L142 30" fill="none" stroke="#235c46" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 44Q48 42 81 44" fill="none" stroke="#235c46" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 70Q62 68 119 71" fill="none" stroke="#202b27" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /><path d="M23 97Q62 95 88 98" fill="none" stroke="#202b27" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(133 178) scale(1.55) rotate(-7)"><path d="M0 20Q46 3 102 19Q160 3 206 18L205 179Q161 165 103 184Q49 166 0 181Z" fill="#e4eee7" stroke="#235c46" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M7 11Q50 -3 104 15Q158 -3 200 9L198 168Q153 153 104 174Q55 155 7 171Z" fill="#faf7ef" stroke="#202b27" stroke-width="3.2" stroke-lineca