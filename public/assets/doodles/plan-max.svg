<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title"><title id="title">Pro Max</title><metadata>{&quot;authoring&quot;:&quot;native-vector&quot;,&quot;brief&quot;:&quot;Original editorial doodle for Bantuin, a service turning website briefs into planning documents. Controlled hand-drawn rounded ink lines, slight irregularity, simple shapes, generous negative space. Sea &amp; Sun palette: ocean blue #167DAD, ink #173444, pale sky #DFF2FA, sunshine yellow #FFD35A, blue-white paper #F0FBFF. Transparent background. No written words, gradients, 3D, heavy shadows, watermarks, stock characters, or certification badges. Match this asset family's geometry. A compact orderly group of project folders with one reusable document tab.&quot;}</metadata><g transform="translate(46 59) scale(0.64) rotate(-6)"><path d="M0 40L0 15Q0 7 9 8L77 8L96 26L204 25Q213 25 213 35L211 165Q211 173 202 173L10 174Q1 174 0 165Z" fill="#dff2fa" stroke="#167dad" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 72Q-4 64 5 64L211 61Q221 61 219 72L207 169Q207 176 199 176L10 176Q3 176 2 169Z" fill="#f0fbff" stroke="#173444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 94Q63 91 89 93" fill="none" stroke="#167dad" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(68 110) scale(0.64) rotate(4)"><path d="M0 40L0 15Q0 7 9 8L77 8L96 26L204 25Q213 25 213 35L211 165Q211 173 202 173L10 174Q1 174 0 165Z" fill="#dff2fa" stroke="#167dad" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 72Q-4 64 5 64L211 61Q221 61 219 72L207 169Q207 176 199 176L10 176Q3 176 2 169Z" fill="#f0fbff" stroke="#173444" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 94Q63 91 89 93" fill="none" stroke="#167dad" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="tra