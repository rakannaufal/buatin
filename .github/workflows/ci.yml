name: Native validation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://speckit:ci-fixture-only@127.0.0.1:5432/speckit
      BETTER_AUTH_SECRET: ci-only-secret-never-use-in-production-123456789
      GOOGLE_CLIENT_ID: test-only-google.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-only-google-client-secret
      OWNER_EMAIL: owner@localhost.test
      MOCK_LLM: "true"
      MOCK_LLM_BASE_URL: http://127.0.0.1:4010/v1
      LLM_MIN_INTERVAL_MS: "10"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Start native PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE ROLE speckit WITH LOGIN CREATEDB PASSWORD 'ci-fixture-only';"
          sudo -u postgres psql -c "GRANT pg_read_all_data TO speckit;"
          sudo -u postgres createdb -O speckit speckit
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:migrations
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run security:scan
      - run: npm run security:history
      - run: npm run skills:verify
      - run: npm run templates:verify
      - run: npm test
      - run: npm run build:worker
      - run: npm run build
      - run: npm run test:assets
      - name: Start local services
        run: |
          mkdir -p .local
          npm run mock > .local/mock.log 2>&1 &
          node --import tsx src/worker/index.ts > .local/worker.log 2>&1 &
          echo $! > .local/worker.pid
          npm start > .local/web.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:3000/api/health/ready
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify worker process recovery
        run: |
          kill -TERM "$(cat .local/worker.pid)"
          for attempt in $(seq 1 30); do
            if ! kill -0 "$(cat .local/worker.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          npm run test:recovery
      - run: npm run backup:key
      - name: Verify bounded Vercel processing without a worker
        env:
          PROCESSING_MODE: request
          APP_URL: http://localhost:3101
          CRON_SECRET: test-only-cron-secret-not-for-production
          TURNSTILE_SITE_KEY: test-only-site
        run: |
          npm start -- --port 3101 > .local/request-web.log 2>&1 &
          request_web_pid=$!
          trap 'kill -TERM "$request_web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3101/api/health/ready; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:3101/api/health/ready
          npm run test:request
          npm run test:e2e -- tests/e2e/workspace.spec.ts --grep 'desktop:|mobile:'
          npm run test:e2e -- tests/e2e/challenge.spec.ts
      - run: npm run db:backup
      - run: npm run test:backup
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Build worker with ClamAV and PostgreSQL tools
        run: |
          docker build --tag buatin-worker:ci --file deploy/worker.Dockerfile .
          docker run --rm --entrypoint pg_dump buatin-worker:ci --version
          docker run --rm --entrypoint clamscan buatin-worker:ci --version
          docker run --rm --entrypoint node \
            -e DATABASE_URL=postgresql://fixture@127.0.0.1:5432/fixture \
            -e BETTER_AUTH_SECRET=ci-only-worker-image-secret-not-for-production \
            buatin-worker:ci --import tsx --input-type=module \
            -e 'const {db} = await import("./src/server/db.ts"); await db.$disconnect();'
          set +e
          docker run --rm --entrypoint node buatin-worker:ci scripts/reference-scanner.mjs --health
          scanner_status=$?
          set -e
          test "$scanner_status" -eq 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
