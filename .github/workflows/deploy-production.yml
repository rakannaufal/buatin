name: Deploy verified production
on:
  workflow_run:
    workflows: [Native validation]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Deploy the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: node scripts/deploy-verified.mjs
      - name: Install smoke runner
        run: npm ci
      - name: Verify public runtime
        env:
          APP_URL: ${{ vars.PRODUCTION_URL || 'https://bantuin.ai.id' }}
        run: npm run deploy:smoke -- --scope=operations
